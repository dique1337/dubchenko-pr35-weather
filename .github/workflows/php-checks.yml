name: PHP Syntax Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  php-lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Check PHP syntax
        run: |
          # Ищем все .php файлы, исключая папку vendor
          # Если находим ошибку, выходим с кодом 1
          find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \; | grep "Parse error" && exit 1 || true
          echo "All PHP files passed syntax check!"